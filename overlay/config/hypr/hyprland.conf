# Omarchy-Debian Hyprland config — classic .conf syntax.
#
# Upstream Omarchy 4.x configures Hyprland through the Lua API (hl.*).
# Packaged Hyprland versions vary (trixie-backports ships 0.55 with Lua
# support; older releases lack it), so this file is a functional port of the
# core defaults in classic .conf syntax — it works everywhere. To use
# upstream's Lua config on a Lua-capable Hyprland, copy
# ~/.local/share/omarchy/config/hypr/*.lua into ~/.config/hypr/ instead.
#
# User overrides: put them in ~/.config/hypr/extra.conf (sourced at the end).

monitor=,preferred,auto,1

env = OMARCHY_PATH,~/.local/share/omarchy
env = TERMINAL,xdg-terminal-exec
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = INPUT_METHOD,fcitx

# --- Startup -----------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = udiskie --tray
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = hyprpaper
exec-once = fcitx5 -d --replace
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- Input -------------------------------------------------------------------
input {
    kb_layout = us
    kb_options = compose:caps
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# --- Look & feel (Tokyo Night-ish defaults) ----------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(414868aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 3
    col.shadow = rgba(1a1b26cc)
}

animations {
    enabled = true
    bezier = omarchy, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, omarchy
    animation = windowsOut, 1, 4, omarchy, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# --- Keybindings (Omarchy-style) ---------------------------------------------
$mainMod = SUPER

bind = $mainMod, Return, exec, xdg-terminal-exec
bind = $mainMod, SPACE, exec, fuzzel
bind = $mainMod, W, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating
bind = $mainMod, P, pseudo

# Apps (Omarchy defaults, Debian-available binaries)
bind = $mainMod SHIFT, F, exec, nautilus
bind = $mainMod SHIFT, B, exec, xdg-open https://
bind = $mainMod SHIFT, M, exec, xdg-terminal-exec btop
bind = $mainMod SHIFT, D, exec, xdg-terminal-exec lazydocker

# Capture
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy

# Lock
bind = $mainMod SHIFT, L, exec, hyprlock

# Focus (vim + arrows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, TAB, workspace, previous

# Media / brightness
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Clipboard history
bind = $mainMod CTRL, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Window rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Open File)$

# Optional user overrides (create the file to use it).
source = ~/.config/hypr/extra.conf
